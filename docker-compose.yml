# Mini Trello 全栈编排：db(MySQL 8.4) + api(FastAPI) + web(nginx)。
# 一键起栈：  cp .env.example .env && docker compose up --build -d
# 验证：      docker compose exec api pytest -q
# redis 属阶段 5 多实例广播，默认不启动： docker compose --profile scale up -d

name: mini-trello

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mini_trello}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-123456}@db:3306/${MYSQL_DATABASE:-mini_trello}?charset=utf8mb4
      # 供容器内 pytest 使用的测试库（deploy/mysql-init 已创建 mini_trello_test）
      TEST_DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-123456}@db:3306/mini_trello_test?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please-32+}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # 阶段 5：多实例事件广播。默认不启动，使用 --profile scale 启用。
  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  db_data:
  uploads_data:
