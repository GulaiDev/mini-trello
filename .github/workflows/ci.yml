name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消尚未完成的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # 仅用于 CI/契约生成的非敏感密钥（长度 >= 32）
  JWT_SECRET: "ci-only-secret-key-that-is-long-enough-32+"

jobs:
  api-lint:
    name: api-lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  api-test:
    name: api-test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: api-lint
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: mini_trello_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      ENVIRONMENT: test
      DATABASE_URL: mysql+aiomysql://root:123456@127.0.0.1:3306/mini_trello_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+aiomysql://root:123456@127.0.0.1:3306/mini_trello_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 应用迁移 (alembic upgrade head)
        run: alembic upgrade head
      - name: 运行测试
        run: pytest --cov=app --cov-report=term-missing -q

  web-lint:
    name: web-lint (eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: 类型检查
        run: npm run typecheck

  web-test:
    name: web-test (vitest)
    runs-on: ubuntu-latest
    needs: web-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 运行测试
        run: npm run test

  contract:
    name: contract (openapi drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 重新生成契约并比对提交版本
        run: |
          python scripts/export_openapi.py --stdout > /tmp/openapi.json
          git diff --no-index --exit-code openapi.json /tmp/openapi.json

  build:
    name: build (docker images)
    runs-on: ubuntu-latest
    needs: [api-test, web-test, contract]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -t mini-trello-api:ci ./backend
      - name: 构建前端镜像
        run: docker build -t mini-trello-web:ci ./frontend
